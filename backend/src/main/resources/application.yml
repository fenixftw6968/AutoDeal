server:
  port: ${PORT:8080}

spring:
  application:
    name: autodeal-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/autodeal}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes cache TTL
      cache-null-values: false

app:
  jwt:
    secret: ${JWT_SECRET:AutoDealUltraSecureSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

logging:
  level:
    root: INFO
    com.autodeal: DEBUG
    org.springframework.data.mongodb: INFO
